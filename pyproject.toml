[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "south-estonian-mcp"
version = "0.2.0"
description = "Public South Estonian dictionary, corpus, grammar, and language tools over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.0.0",
    "modal",
    "libsql>=0.1.11",
]

[project.optional-dependencies]
semantic = ["numpy>=1.26,<3", "torch>=2.2", "transformers>=4.56,<5", "sentence-transformers>=3.0", "safetensors>=0.4", "huggingface-hub>=0.24"]
classifier = ["numpy>=1.26,<3", "torch>=2.2", "transformers>=4.56,<5", "sentencepiece>=0.2", "safetensors>=0.4", "scikit-learn>=1.4", "scipy>=1.11", "joblib>=1.3", "fasttext>=0.9.3"]
local-mt = ["torch>=2.2", "transformers>=4.56,<5", "sentencepiece>=0.2", "safetensors>=0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
south-estonian-mcp = "vro_mcp.server:main"
south-estonian-mcp-check = "vro_mcp.check_setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vro_mcp = ["rules/*.json", "sources-public.json"]
